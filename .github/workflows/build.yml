name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Windows as well as Linux: development happens on both, and the Node scripts and
    # the line-ending rules have to work on each.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Lint + typecheck + unit tests
      - run: npm run check

      # Typecheck, Vite build for chrome53, then scripts/check-bundle.mjs fails the build
      # if Chromium 53 (webOS 4) could not run it
      - run: npm run build

      - run: npm run package

      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ipk
          path: build/*.ipk
          if-no-files-found: error
